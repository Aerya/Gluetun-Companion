name: Tests Python

# Toute la suite pytest, sans Docker : les tests simulent l'API Docker.
# - pull_request : chaque PR, quelle que soit sa branche cible ;
# - push : uniquement main, pour éviter un second run sur les branches de PR.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Même version de Python que l'image (Dockerfile : python:3.14-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances de l'application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.2.0

      - name: Lancer la suite complète
        env:
          # Aucun démon Docker n'est contacté : toute tentative échoue vite.
          DOCKER_HOST: tcp://127.0.0.1:1
        run: python -m pytest -q -p no:cacheprovider
